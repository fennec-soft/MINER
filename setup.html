<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعداد البرنامج لأول مرة</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; transition: background 0.5s ease; }
        .setup-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 450px; }
        .setup-container h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; transition: color 0.5s ease; }
        .setup-container p { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .form-group label { font-weight: bold; color: #34495e; font-size: 14px; }
        .form-group input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn-save { width: 100%; padding: 12px; background: #1abc9c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: background 0.5s ease; }
        .btn-save:hover { filter: brightness(90%); }
        
        /* ستايل معاينة اللوغو */
        .logo-preview-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; }
        #logo-preview { max-width: 120px; max-height: 120px; display: none; border-radius: 6px; border: 2px dashed #ddd; padding: 5px; }
    </style>
</head>
<body>

    <div class="setup-container">
        <h2 id="setup-title">تهيئة المحاسب الذكي 📊</h2>
        <p>يرجى إدخال معلومات مؤسستك واختيار الشعار لبدء استخدام البرنامج</p>
        
        <div class="form-group">
            <label>اسم المؤسسة / المحل التجاري:</label>
            <input type="text" id="comp-name" placeholder="مثال: مؤسسة التاجر لبيع المواد الغذائية">
        </div>
        <div class="form-group">
            <label>المقر / العنوان الفعلي:</label>
            <input type="text" id="comp-address" placeholder="مثال: الجزائر العاصمة">
        </div>
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="text" id="comp-phone" placeholder="مثال: 0555123456">
        </div>

        <div class="form-group">
            <label>شعار المؤسسة (Logo):</label>
            <input type="file" id="comp-logo-file" accept="image/*" onchange="handleLogoSelection(this)">
        </div>

        <div class="logo-preview-container">
            <img id="logo-preview" src="" alt="معاينة الشعار">
        </div>
        
        <button id="save-btn" class="btn-save" onclick="saveCompanyProfile()">حفظ البيانات وبدء البرنامج</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let selectedLogoPath = '';
        let detectedThemeColor = '#1abc9c'; // اللون الافتراضي

        // دالة التعامل مع اختيار الصورة واستخراج اللون منها
        function handleLogoSelection(input) {
            const file = input.files[0];
            if (!file) return;

            // حفظ المسار الحقيقي للملف
            selectedLogoPath = file.path;

            // عرض معاينة الصورة
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgEl = document.getElementById('logo-preview');
                imgEl.src = e.target.result;
                imgEl.style.display = 'block';

                // استخراج اللون المهيمن بواسطة Canvas
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    detectedThemeColor = extractDominantColor(img);
                    // تغيير ألوان شاشة الإعداد فوراً ليعرف الزبون بلي السيستم قرأ ألوانه
                    document.body.style.backgroundColor = detectedThemeColor;
                    document.getElementById('save-btn').style.backgroundColor = detectedThemeColor;
                    document.getElementById('setup-title').style.color = detectedThemeColor;
                }
            }
            reader.readAsDataURL(file);
        }

        // دالة ذكية تقرأ البيكسلات وتجيب متوسط اللون المهيمن (تتجنب الأبيض والأسود النقي)
        function extractDominantColor(imageObject) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 50; // تصغير الحجم لسرعة الحساب
            canvas.height = 50;
            ctx.drawImage(imageObject, 0, 0, 50, 50);
            
            const imageData = ctx.getImageData(0, 0, 50, 50).data;
            let r=0, g=0, b=0, count=0;
            
            for (let i = 0; i < imageData.length; i += 4) {
                let R = imageData[i];
                let G = imageData[i+1];
                let B = imageData[i+2];
                
                // تجاهل الألوان القريبة جداً من الأبيض الناصع أو الأسود القاتم باش يخرج لون حيوي
                if ((R > 240 && G > 240 && B > 240) || (R < 25 && G < 25 && B < 25)) {
                    continue;
                }
                r += R; g += G; b += B;
                count++;
            }
            
            if(count === 0) return '#1abc9c'; // لون احتياطي في حال كان اللوغو أبيض وأسود فقط
            
            r = Math.floor(r / count);
            g = Math.floor(g / count);
            b = Math.floor(b / count);
            
            // تحويل الصيغة إلى HEX
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function saveCompanyProfile() {
            const name = document.getElementById('comp-name').value.trim();
            const address = document.getElementById('comp-address').value.trim();
            const phone = document.getElementById('comp-phone').value.trim();

            if (!name || !address) {
                return alert('يرجى ملء اسم المؤسسة والعنوان على الأقل!');
            }

            // إرسال البيانات بالإضافة للمسار واللون المستخرج إلى main.js
            ipcRenderer.send('save-setup-data', { 
                name, 
                address, 
                phone, 
                logoPath: selectedLogoPath,
                themeColor: detectedThemeColor
            });
        }
    </script>
</body>
</html>
